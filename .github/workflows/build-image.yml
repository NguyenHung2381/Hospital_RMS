# Image cho mỗi commit trên main, tag = commit SHA (staging/production dùng chung,
# không build lại lúc deploy). Chỉ ci.yml gọi, sau khi "CI · kết quả" xanh — không
# chạy tay để không có image nào lên GHCR mà chưa qua kiểm tra.
#
# Phần nào đổi thì build phần đó. App KHÔNG đổi so với commit trước thì chỉ gắn
# thêm tag SHA mới cho image của commit trước, ngay trên registry (vài giây, không
# build, không tải layer). Vẫn build lại khi:
#   - thư mục app (context build) hoặc file workflow này đổi;
#   - commit trước không có image (pipeline của nó hỏng / đang chạy) hoặc push đè lịch sử;
#   - image gốc build quá MAX_AGE_DAYS ngày → lấy bản vá base image (apk upgrade,
#     node/nginx alpine) và quét Trivy lại.
# Image gắn lại giữ nguyên SBOM + provenance + GIT_SHA của lần build gốc (cùng mã
# nguồn app). scripts/deploy.sh so /health với GIT_SHA trong image nên vẫn đúng.
#
# Bằng chứng (artifact 365 ngày): báo cáo Trivy JSON mỗi app. SBOM + provenance gắn
# vào image trên GHCR. Cuối cùng ký image bằng cosign (job sign) — deploy.yml xác minh.
name: Build image

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  MAX_AGE_DAYS: 7

jobs:
  plan:
    name: Phần nào cần build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      retag: ${{ steps.plan.outputs.retag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # so sánh với commit trước của lần push
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          build=() retag=()
          for app in backend frontend; do
            reason=""
            if ! [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || [[ "$BEFORE" =~ ^0+$ ]]; then
              reason="không có commit trước"
            elif ! git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA" 2>/dev/null; then
              reason="push đè lịch sử"
            elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "$app/" .github/workflows/build-image.yml; then
              reason="mã nguồn đổi"
            elif ! info=$(docker buildx imagetools inspect "$registry/hospital_rms-$app:$BEFORE" --format '{{json .Image}}' 2>/dev/null); then
              reason="commit trước không có image"
            else
              created=$(jq -r 'if has("created") then .created else ([.[]][0].created // empty) end' <<<"$info")
              age_days=$(( ( $(date +%s) - $(date -d "${created:-1970-01-01}" +%s) ) / 86400 ))
              if [ "$age_days" -ge "$MAX_AGE_DAYS" ]; then
                reason="image gốc đã $age_days ngày — build lại lấy bản vá"
              fi
            fi
            if [ -n "$reason" ]; then
              build+=("$app"); echo "$app: BUILD ($reason)"
            else
              retag+=("$app"); echo "$app: gắn tag từ ${BEFORE::7} (không đổi)"
            fi
          done
          to_json() { if [ "$#" -eq 0 ]; then echo '[]'; else printf '%s\n' "$@" | jq -R . | jq -sc .; fi; }
          echo "build=$(to_json "${build[@]}")" >> "$GITHUB_OUTPUT"
          echo "retag=$(to_json "${retag[@]}")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app }}
    needs: plan
    if: needs.plan.outputs.build != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: ${{ fromJson(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: name
        env:
          APP: ${{ matrix.app }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hospital_rms-${APP}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.app }}
          target: prod
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          tags: ${{ steps.name.outputs.image }}
          load: true
          # Cache chỉ ghi từ main (workflow này chỉ chạy trên main) → PR không đầu độc được
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Quét image (Trivy — lỗ hổng + bí mật)
        # Quét 1 lần ra báo cáo JSON đầy đủ (lưu làm bằng chứng), rồi xét từ báo cáo:
        #  - in lỗ hổng HIGH+ đã có bản vá;
        #  - CHẶN: lỗ hổng CRITICAL đã có bản vá; bí mật HIGH+ nằm trong image (khoá,
        #    token, mật khẩu lọt qua .dockerignore).
        # Image Trivy ghim digest.
        env:
          APP: ${{ matrix.app }}
          IMAGE: ${{ steps.name.outputs.image }}
          TRIVY: aquasec/trivy:0.57.1@sha256:5c59e08f980b5d4d503329773480fcea2c9bdad7e381d846fbf9f2ecb8050f6b
        run: |
          out="$RUNNER_TEMP/evidence"; mkdir -p "$out"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache -v "$out:/out" \
            "$TRIVY" image --no-progress --quiet --scanners vuln,secret --format json --output "/out/trivy-$APP.json" "$IMAGE"
          report="$out/trivy-$APP.json"
          # $t là biến của jq, không phải của shell
          # shellcheck disable=SC2016
          fixed='[.Results[]? | .Target as $t | .Vulnerabilities[]? | select((.FixedVersion // "") != "") | . + {Target: $t}]'
          jq -r "$fixed | map(select(.Severity == \"HIGH\" or .Severity == \"CRITICAL\"))[]
            | \"\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion) → \(.FixedVersion)\t\(.Target)\"" "$report"
          critical=$(jq "$fixed | map(select(.Severity == \"CRITICAL\")) | length" "$report")
          secrets=$(jq '[.Results[]? | .Target as $t | .Secrets[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")
            | "\(.Severity) \(.RuleID) \($t):\(.StartLine)"]' "$report")
          nsecrets=$(jq length <<<"$secrets")
          {
            echo "### Trivy · $APP"
            jq -r '[.Results[]?.Vulnerabilities[]?.Severity] | group_by(.) | map("- \(.[0]): \(length)") | .[]' "$report"
            echo "- CRITICAL có bản vá: $critical · bí mật HIGH+: $nsecrets"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$nsecrets" -gt 0 ]; then echo "::error::Image có bí mật:"; jq -r '.[]' <<<"$secrets"; fi
          if [ "$critical" -gt 0 ]; then echo "::error::$critical lỗ hổng CRITICAL đã có bản vá — nâng gói / base image"; fi
          [ "$critical" -eq 0 ] && [ "$nsecrets" -eq 0 ]
      - name: Lưu báo cáo quét (bằng chứng)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.app }}-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 365
          if-no-files-found: ignore
      - name: Push (kèm SBOM + provenance)
        # Cùng tham số với bước Build → dùng lại cache, không build khác đi
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.app }}
          target: prod
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          tags: ${{ steps.name.outputs.image }}
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.app }}
      - name: Tóm tắt
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          echo "- Build mới: $IMAGE" >> "$GITHUB_STEP_SUMMARY"

  retag:
    name: Gắn tag ${{ matrix.app }} (không đổi)
    needs: plan
    if: needs.plan.outputs.retag != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        app: ${{ fromJson(needs.plan.outputs.retag) }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Gắn tag SHA mới cho image commit trước
        # Sao chép manifest ngay trên registry (cùng digest, giữ SBOM + provenance)
        env:
          APP: ${{ matrix.app }}
          BEFORE: ${{ github.event.before }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hospital_rms-$APP"
          docker buildx imagetools create --tag "$repo:$GITHUB_SHA" "$repo:$BEFORE"
          digest=$(docker buildx imagetools inspect "$repo:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "- Gắn tag: $repo:$GITHUB_SHA ← ${BEFORE::7} ($digest)" >> "$GITHUB_STEP_SUMMARY"

  # Ký image của commit này bằng cosign (khoá riêng của bệnh viện, KHÔNG đẩy lên log
  # minh bạch công khai Rekor → không lộ tên repo private). Job deploy xác minh chữ ký
  # bằng khoá công khai (biến COSIGN_PUBLIC_KEY) trước khi chạy → image không do
  # pipeline này build/ký thì không lên được server.
  # Khoá riêng nằm ở environment "image-signing" (chỉ nhánh main) — PR, kể cả PR
  # sửa workflow, không đọc được. Job này không checkout / không chạy mã của repo.
  # Image gắn lại tag (cùng digest) đã ký từ lần build gốc thì bỏ qua.
  sign:
    name: Ký image (cosign)
    needs: [build, retag]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: image-signing
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Ký
        env:
          COSIGN: ghcr.io/sigstore/cosign/cosign:v2.6.5@sha256:ad281047f85c5e1fc6ffbc30c2b55be3b07b4032bef715a12122ce5829619aca
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
          TOKEN: ${{ github.token }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::warning::Chưa cấu hình khoá ký image (secret COSIGN_PRIVATE_KEY ở environment image-signing) — xem .github/CICD.md"
            echo "- Ký image: **chưa bật**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Cấu hình đăng nhập riêng cho container cosign (không dùng credential helper của máy)
          dc="$RUNNER_TEMP/cosign-docker"
          (umask 077; mkdir -p "$dc"
           printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$(printf '%s:%s' "$GITHUB_ACTOR" "$TOKEN" | base64 -w0)" > "$dc/config.json")
          cosign() { docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e DOCKER_CONFIG=/dc -v "$dc:/dc:ro" \
            -e COSIGN_PRIVATE_KEY -e COSIGN_PASSWORD -e COSIGN_PUBLIC_KEY "$COSIGN" "$@"; }
          verify() { cosign verify --key env://COSIGN_PUBLIC_KEY --insecure-ignore-tlog=true "$1" >/dev/null 2>&1; }
          for app in backend frontend; do
            repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hospital_rms-$app"
            digest=$(docker buildx imagetools inspect "$repo:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
            ref="$repo@$digest"
            if [ -n "$COSIGN_PUBLIC_KEY" ] && verify "$ref"; then
              echo "- Đã ký từ trước: $ref" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "$ref"
            # Khoá công khai đặt sai cặp → deploy sẽ hỏng; báo ngay ở đây
            if [ -n "$COSIGN_PUBLIC_KEY" ] && ! verify "$ref"; then
              echo "::error::Ký xong nhưng COSIGN_PUBLIC_KEY không xác minh được — khoá công khai không cùng cặp với COSIGN_PRIVATE_KEY"
              exit 1
            fi
            echo "- Đã ký: $ref" >> "$GITHUB_STEP_SUMMARY"
          done
          rm -rf "$dc"
