# Image cho mỗi commit trên main, tag = commit SHA (staging/production dùng chung,
# không build lại lúc deploy). Chỉ ci.yml gọi, sau khi "CI · kết quả" xanh — không
# chạy tay để không có image nào lên GHCR mà chưa qua kiểm tra.
#
# Phần nào đổi thì build phần đó. App KHÔNG đổi so với commit trước thì chỉ gắn
# thêm tag SHA mới cho image của commit trước, ngay trên registry (vài giây, không
# build, không tải layer). Vẫn build lại khi:
#   - thư mục app (context build) hoặc file workflow này đổi;
#   - commit trước không có image (pipeline của nó hỏng / đang chạy) hoặc push đè lịch sử;
#   - image gốc build quá MAX_AGE_DAYS ngày → lấy bản vá base image (apk upgrade,
#     node/nginx alpine) và quét Trivy lại.
# Image gắn lại giữ nguyên SBOM + provenance + GIT_SHA của lần build gốc (cùng mã
# nguồn app). scripts/deploy.sh so /health với GIT_SHA trong image nên vẫn đúng.
name: Build image

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  MAX_AGE_DAYS: 7

jobs:
  plan:
    name: Phần nào cần build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      retag: ${{ steps.plan.outputs.retag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # so sánh với commit trước của lần push
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          build=() retag=()
          for app in backend frontend; do
            reason=""
            if ! [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || [[ "$BEFORE" =~ ^0+$ ]]; then
              reason="không có commit trước"
            elif ! git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA" 2>/dev/null; then
              reason="push đè lịch sử"
            elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "$app/" .github/workflows/build-image.yml; then
              reason="mã nguồn đổi"
            elif ! info=$(docker buildx imagetools inspect "$registry/hospital_rms-$app:$BEFORE" --format '{{json .Image}}' 2>/dev/null); then
              reason="commit trước không có image"
            else
              created=$(jq -r 'if has("created") then .created else ([.[]][0].created // empty) end' <<<"$info")
              age_days=$(( ( $(date +%s) - $(date -d "${created:-1970-01-01}" +%s) ) / 86400 ))
              if [ "$age_days" -ge "$MAX_AGE_DAYS" ]; then
                reason="image gốc đã $age_days ngày — build lại lấy bản vá"
              fi
            fi
            if [ -n "$reason" ]; then
              build+=("$app"); echo "$app: BUILD ($reason)"
            else
              retag+=("$app"); echo "$app: gắn tag từ ${BEFORE::7} (không đổi)"
            fi
          done
          to_json() { if [ "$#" -eq 0 ]; then echo '[]'; else printf '%s\n' "$@" | jq -R . | jq -sc .; fi; }
          echo "build=$(to_json "${build[@]}")" >> "$GITHUB_OUTPUT"
          echo "retag=$(to_json "${retag[@]}")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app }}
    needs: plan
    if: needs.plan.outputs.build != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: ${{ fromJson(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: name
        env:
          APP: ${{ matrix.app }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hospital_rms-${APP}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.app }}
          target: prod
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          tags: ${{ steps.name.outputs.image }}
          load: true
          # Cache chỉ ghi từ main (workflow này chỉ chạy trên main) → PR không đầu độc được
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Quét image (Trivy)
        # In mọi lỗ hổng HIGH+, chỉ chặn CRITICAL đã có bản vá. Image Trivy ghim digest.
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TRIVY: aquasec/trivy:0.57.1@sha256:5c59e08f980b5d4d503329773480fcea2c9bdad7e381d846fbf9f2ecb8050f6b
        run: |
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            "$TRIVY" image --no-progress --ignore-unfixed "$@" "$IMAGE"; }
          trivy --severity HIGH,CRITICAL --exit-code 0
          trivy --severity CRITICAL --exit-code 1 --quiet
      - name: Push (kèm SBOM + provenance)
        # Cùng tham số với bước Build → dùng lại cache, không build khác đi
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.app }}
          target: prod
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          tags: ${{ steps.name.outputs.image }}
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.app }}
      - name: Tóm tắt
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          echo "- Build mới: $IMAGE" >> "$GITHUB_STEP_SUMMARY"

  retag:
    name: Gắn tag ${{ matrix.app }} (không đổi)
    needs: plan
    if: needs.plan.outputs.retag != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        app: ${{ fromJson(needs.plan.outputs.retag) }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Gắn tag SHA mới cho image commit trước
        # Sao chép manifest ngay trên registry (cùng digest, giữ SBOM + provenance)
        env:
          APP: ${{ matrix.app }}
          BEFORE: ${{ github.event.before }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hospital_rms-$APP"
          docker buildx imagetools create --tag "$repo:$GITHUB_SHA" "$repo:$BEFORE"
          digest=$(docker buildx imagetools inspect "$repo:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "- Gắn tag: $repo:$GITHUB_SHA ← ${BEFORE::7} ($digest)" >> "$GITHUB_STEP_SUMMARY"
