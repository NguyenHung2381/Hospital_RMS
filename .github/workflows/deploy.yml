# Triển khai 1 image ĐÃ BUILD SẴN (tag = commit SHA) lên 1 môi trường.
#  - ci.yml gọi tự động sau khi build image trên main (staging → production).
#  - Chạy tay (Actions → Deploy → Run workflow) để ROLLBACK: chọn môi trường,
#    nhập SHA của bản cũ (xem tab Environments hoặc logs/deploy-history.log).
# Production cần người duyệt (Environment protection rules, xem .github/CICD.md).
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Môi trường
        type: environment
        required: true
      tag:
        description: Commit SHA đầy đủ (40 ký tự) của bản cần triển khai
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    # Runner cài trên chính server Ubuntu (mạng nội bộ bệnh viện, GitHub không gọi
    # vào được) — runner tự kết nối ra ngoài để nhận job. Mỗi môi trường 1 nhãn.
    # User chạy runner phải thuộc nhóm docker; backup trước migration cần pg_dump
    # (postgresql-client) trên máy — xem infra/cai-dat-may-ao-ubuntu.md.
    runs-on: [self-hosted, 'rms-${{ inputs.environment }}']
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    # Không bao giờ chạy 2 lần deploy cùng môi trường; bản mới chờ bản đang chạy
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Đăng nhập registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Triển khai + smoke test (tự rollback khi hỏng)
        env:
          TAG: ${{ inputs.tag }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || github.workspace }}
          COMPOSE_PROJECT: ${{ vars.COMPOSE_PROJECT || 'hospital_rms' }}
          BACKEND_URL: ${{ vars.BACKEND_URL || 'http://127.0.0.1:3001' }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'http://127.0.0.1:8081' }}
          MIGRATION_BACKUP_DIR: ${{ vars.MIGRATION_BACKUP_DIR }}
          MIGRATION_DB_USER: ${{ secrets.MIGRATION_DB_USER }}
          MIGRATION_DB_PASSWORD: ${{ secrets.MIGRATION_DB_PASSWORD }}
        run: scripts/deploy.sh "$TAG" "$REGISTRY"
      - name: Đăng xuất registry
        if: always()
        run: docker logout ghcr.io
