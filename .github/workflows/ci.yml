# Điều phối CI/CD — chỉ gọi các workflow con, không chứa logic kiểm tra.
# Mỗi phần nằm ở 1 file riêng, chạy tay riêng được (Actions → chọn workflow →
# Run workflow), sửa phần nào không đụng phần khác:
#
#   check-dependencies.yml  Phiên bản chính thức (cấm beta/rc), nguồn gói, npm audit, chữ ký gói
#   check-secrets.yml       Không commit bí mật (file nhạy cảm, chuỗi bí mật, gitleaks)
#   check-sast.yml          Quét lỗ hổng mã nguồn (Semgrep)
#   check-infra.yml         Lint workflow (actionlint, zizmor), Dockerfile (hadolint), shell (shellcheck)
#   check-backend.yml       Lint/format/kiểu · kiến trúc · test theo nhóm · coverage · PostgreSQL
#   check-frontend.yml      Lint + kiểu · build production
#   build-image.yml         Build image 1 lần (tag = SHA), Trivy, SBOM + provenance → GHCR
#   deploy.yml              Deploy 1 SHA lên 1 môi trường (chạy tay = rollback)
#
# PR chỉ chạy backend/frontend khi có file thuộc phần đó đổi; các kiểm tra bảo
# mật luôn chạy. Push vào main / lịch tuần: chạy tất cả.
# Branch protection chỉ cần 1 check: "CI · kết quả" (gom kết quả mọi phần).
# Chi tiết: .github/CICD.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Chạy lại hằng tuần để phát hiện lỗ hổng mới công bố trong thư viện đang dùng,
  # kể cả khi không có ai push code.
  schedule:
    - cron: '0 1 * * 1'

permissions: {}

# PR: push mới huỷ lần chạy cũ. main: mỗi commit 1 nhóm riêng, KHÔNG huỷ nhau —
# commit nào cũng có kết quả + image; deploy tự xếp hàng theo môi trường.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  # PR: xem file nào đổi để bỏ qua phần không liên quan. Sửa workflow/script CI
  # thì chạy tất cả.
  changes:
    name: Phần nào thay đổi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          printf '%s\n' "$files" | sed 's/^/  /'
          has() { if printf '%s\n' "$files" | grep -qE "$1"; then echo true; else echo false; fi; }
          all=$(has '^(\.github/workflows/|scripts/ci/)')
          backend=$(has '^(backend/|infra/postgresql/)')
          frontend=$(has '^frontend/')
          [ "$all" = true ] && backend=true && frontend=true
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend frontend=$frontend"

  dependencies:
    name: Phụ thuộc
    uses: ./.github/workflows/check-dependencies.yml
    permissions:
      contents: read

  secrets:
    name: Bí mật
    uses: ./.github/workflows/check-secrets.yml
    permissions:
      contents: read

  sast:
    name: SAST
    uses: ./.github/workflows/check-sast.yml
    permissions:
      contents: read

  infra:
    name: Hạ tầng
    uses: ./.github/workflows/check-infra.yml
    permissions:
      contents: read

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/check-backend.yml
    permissions:
      contents: read

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/check-frontend.yml
    permissions:
      contents: read

  # Check bắt buộc duy nhất cho branch protection. Phần bị bỏ qua (PR không
  # đụng tới) tính là đạt; hỏng hoặc bị huỷ thì đỏ.
  result:
    name: CI · kết quả
    needs: [changes, dependencies, secrets, sast, infra, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then echo "::error::Chưa đạt: $bad"; exit 1; fi

  image:
    name: Image
    needs: result
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write

  # Staging tuỳ chọn: bật bằng biến repo ENABLE_STAGING=true khi đã có runner rms-staging
  deploy-staging:
    name: Deploy staging
    needs: image
    if: vars.ENABLE_STAGING == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: staging
      tag: ${{ github.sha }}

  # Chỉ tự deploy khi AUTO_DEPLOY_PRODUCTION=true VÀ environment production đã có
  # người duyệt (required reviewers). Mặc định: deploy production bằng tay qua
  # workflow Deploy — xem .github/CICD.md.
  deploy-production:
    name: Deploy production
    needs: [image, deploy-staging]
    if: >-
      always() && vars.AUTO_DEPLOY_PRODUCTION == 'true' && needs.image.result == 'success' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: production
      tag: ${{ github.sha }}

  # Pipeline trên main / lịch tuần hỏng → mở issue giao cho người kích hoạt
  # (GitHub cũng gửi email). PR hỏng thì tác giả đã thấy ngay trên PR.
  notify:
    name: Báo lỗi pipeline
    needs: [result, image, deploy-staging, deploy-production]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_ACTOR" \
            --title "CI/CD hỏng: ${GITHUB_SHA::7} ($GITHUB_EVENT_NAME)" \
            --body "Lần chạy: $RUN_URL
          Commit: $GITHUB_SHA
          Người kích hoạt: @$GITHUB_ACTOR

          Người nhận xử lý hoặc chuyển đúng người (.github/CICD.md → Trách nhiệm)."
