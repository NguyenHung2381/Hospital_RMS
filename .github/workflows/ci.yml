# Điều phối CI/CD — chỉ gọi các workflow con, không chứa logic kiểm tra.
# Mỗi phần nằm ở 1 file riêng, chạy tay riêng được (Actions → chọn workflow →
# Run workflow), sửa phần nào không đụng phần khác:
#
#   check-dependencies.yml  Phiên bản chính thức (cấm beta/rc), nguồn gói, npm audit, chữ ký gói
#   check-secrets.yml       Không commit bí mật (file nhạy cảm, chuỗi bí mật, gitleaks)
#   check-sast.yml          Quét lỗ hổng mã nguồn (Semgrep)
#   check-infra.yml         Lint workflow (actionlint, zizmor), Dockerfile (hadolint), shell (shellcheck)
#   check-governance.yml    Tuân thủ: giấy phép thư viện, quy tắc migration, vết duyệt thay đổi vào main
#   check-backend.yml       Lint/format/kiểu · kiến trúc · test theo nhóm · coverage · PostgreSQL
#   check-frontend.yml      Lint + kiểu · build production
#   check-image.yml         Chạy thử bản production: image prod + compose + deploy.sh + tự rollback
#   build-image.yml         Build image 1 lần (tag = SHA), Trivy (lỗ hổng + bí mật), SBOM + provenance → GHCR, ký cosign
#   deploy.yml              Cổng (SHA trên main + CI xanh) → xác minh chữ ký → deploy → bản ghi kiểm toán
#
# PR chỉ chạy backend/frontend khi có file thuộc phần đó đổi; các kiểm tra bảo
# mật luôn chạy. Push vào main / lịch tuần: chạy tất cả.
# Branch protection chỉ cần 1 check: "CI · kết quả" (gom kết quả mọi phần).
# Chi tiết: .github/CICD.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Chạy lại hằng tuần để phát hiện lỗ hổng mới công bố trong thư viện đang dùng,
  # kể cả khi không có ai push code.
  schedule:
    - cron: '0 1 * * 1'

permissions: {}

# PR: push mới huỷ lần chạy cũ. main: mỗi commit 1 nhóm riêng, KHÔNG huỷ nhau —
# commit nào cũng có kết quả + image; deploy tự xếp hàng theo môi trường.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  # PR: xem file nào đổi để bỏ qua phần không liên quan. Sửa workflow/script CI
  # thì chạy tất cả.
  changes:
    name: Phần nào thay đổi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            printf '%s\n' backend=true frontend=true runtime=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          printf '%s\n' "$files" | sed 's/^/  /'
          has() { if printf '%s\n' "$files" | grep -qE "$1"; then echo true; else echo false; fi; }
          all=$(has '^(\.github/workflows/|scripts/ci/)')
          backend=$(has '^(backend/|infra/postgresql/)')
          frontend=$(has '^frontend/')
          # Thứ gì vào image / cách chạy image trên server → chạy thử bản production
          runtime=$(has '^(backend/|frontend/|infra/postgresql/|docker-compose\.prod\.yml$|scripts/deploy\.sh$)')
          [ "$all" = true ] && backend=true && frontend=true && runtime=true
          printf '%s\n' "backend=$backend" "frontend=$frontend" "runtime=$runtime" | tee -a "$GITHUB_OUTPUT"

  dependencies:
    name: Phụ thuộc
    uses: ./.github/workflows/check-dependencies.yml
    permissions:
      contents: read

  secrets:
    name: Bí mật
    uses: ./.github/workflows/check-secrets.yml
    permissions:
      contents: read

  sast:
    name: SAST
    uses: ./.github/workflows/check-sast.yml
    permissions:
      contents: read

  infra:
    name: Hạ tầng
    uses: ./.github/workflows/check-infra.yml
    permissions:
      contents: read

  governance:
    name: Tuân thủ
    uses: ./.github/workflows/check-governance.yml
    permissions:
      contents: read
      pull-requests: read

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/check-backend.yml
    permissions:
      contents: read

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/check-frontend.yml
    permissions:
      contents: read

  smoke:
    name: Chạy thử production
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    uses: ./.github/workflows/check-image.yml
    permissions:
      contents: read

  # Check bắt buộc duy nhất cho branch protection. Phần bị bỏ qua (PR không
  # đụng tới) tính là đạt; hỏng hoặc bị huỷ thì đỏ.
  result:
    name: CI · kết quả
    needs: [changes, dependencies, secrets, sast, infra, governance, backend, frontend, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then echo "::error::Chưa đạt: $bad"; exit 1; fi

  image:
    name: Image
    needs: result
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write

  # Staging tuỳ chọn: bật bằng biến repo ENABLE_STAGING=true khi đã có runner rms-staging
  deploy-staging:
    name: Deploy staging
    needs: image
    if: vars.ENABLE_STAGING == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      actions: read # cổng deploy đọc kết quả CI của commit
      contents: read
      packages: read
    with:
      environment: staging
      tag: ${{ github.sha }}

  # Chỉ tự deploy khi AUTO_DEPLOY_PRODUCTION=true VÀ environment production đã có
  # người duyệt (required reviewers). Mặc định: deploy production bằng tay qua
  # workflow Deploy — xem .github/CICD.md.
  deploy-production:
    name: Deploy production
    needs: [image, deploy-staging]
    if: >-
      always() && vars.AUTO_DEPLOY_PRODUCTION == 'true' && needs.image.result == 'success' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    uses: ./.github/workflows/deploy.yml
    permissions:
      actions: read # cổng deploy đọc kết quả CI của commit
      contents: read
      packages: read
    with:
      environment: production
      tag: ${{ github.sha }}

  # Pipeline trên main / lịch tuần hỏng → 1 issue nhãn "ci-hong" ghi rõ job/bước nào hỏng
  # kèm thông báo lỗi trích từ annotation hoặc log,
  # giao người kích hoạt (GitHub cũng gửi email). Đang có issue mở thì bình luận vào
  # đó thay vì mở thêm. PR hỏng thì tác giả đã thấy ngay trên PR.
  notify:
    name: Báo lỗi pipeline
    needs: [result, image, deploy-staging, deploy-production]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # danh sách job + log
      checks: read # thông báo lỗi (annotation) của từng job
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Mỗi job hỏng: tên, bước hỏng, link log và chính thông báo lỗi —
          # lấy annotation ::error:: trước; không có thì trích đoạn log quanh ##[error].
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out")
              | [.id, .name, .conclusion, .html_url, ([.steps[]? | select(.conclusion == "failure" or .conclusion == "timed_out") | .name] | join(", "))]
              | @tsv')
          failed=""
          while IFS=$'\t' read -r id name concl url steps; do
            [ -n "$id" ] || continue
            failed+="### ❌ $name ($concl)"$'\n'"Bước hỏng: ${steps:-(không rõ)} · [Xem log]($url)"$'\n'
            errs=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations" \
              --jq '.[] | select(.annotation_level == "failure")
                | select(.message | test("^Process completed with exit code") | not)
                | (if .path and .path != ".github" then "\(.path):\(.start_line) " else "" end) + .message' \
              2>/dev/null | head -n 30)
            if [ -z "$errs" ]; then
              errs=$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" 2>/dev/null \
                | sed -E 's/^[0-9]{4}-[0-9-]+T[0-9:.]+Z ?//' \
                | grep -B 25 -m 1 -E '^##\[error\]' \
                | grep -vE '^##\[(group|endgroup)\]' | tail -n 30)
            fi
            failed+=$'```text\n'"${errs:-(không trích được lỗi — mở log)}"$'\n```\n\n'
          done <<< "$jobs"
          body="Lần chạy: $RUN_URL
          Commit: $GITHUB_SHA ($GITHUB_EVENT_NAME, $GITHUB_REF_NAME)
          Người kích hoạt: @$GITHUB_ACTOR

          Job hỏng:
          ${failed:-"(không lấy được danh sách — xem lần chạy)"}

          Người nhận xử lý hoặc chuyển đúng người (.github/CICD.md → Trách nhiệm). Issue tự đóng khi pipeline main xanh lại."
          gh label create ci-hong --color B60205 --description "Pipeline CI/CD trên main hỏng" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-hong --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Vẫn hỏng — $body"
            gh issue edit "$open" --repo "$GITHUB_REPOSITORY" --add-assignee "$GITHUB_ACTOR" || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label ci-hong --assignee "$GITHUB_ACTOR" \
              --title "CI/CD hỏng: ${GITHUB_SHA::7} ($GITHUB_EVENT_NAME)" --body "$body"
          fi

  # main / lịch tuần xanh lại → đóng issue "ci-hong" đang mở
  recovered:
    name: Đóng issue lỗi cũ
    needs: [result, image]
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-hong --state open --json number --jq '.[].number' 2>/dev/null); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Pipeline xanh lại ở ${GITHUB_SHA::7}: $RUN_URL"
          done
