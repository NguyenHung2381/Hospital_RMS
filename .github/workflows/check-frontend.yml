# Frontend: lint + kiểu và build production, 2 job song song để lỗi chỉ rõ chỗ.
# ci.yml gọi khi PR đổi frontend/ (hoặc mọi push vào main); chạy tay được ở
# Actions → "Kiểm tra · Frontend".
name: Kiểm tra · Frontend

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Cùng major với stage build trong frontend/Dockerfile (node:24-alpine)
  NODE_VERSION: '24'

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Lint · kiểu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Kiểu dữ liệu (tsc)
        run: npx tsc -b
      - name: Lint (ESLint + react-hooks)
        run: npm run lint

  build:
    name: Build production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Build
        run: npm run build
      - name: Không lộ source map trong bản build
        # Source map để lộ mã nguồn gốc khi deploy — bản production không được có
        run: |
          maps=$(find dist -name '*.map' | head -20)
          if [ -n "$maps" ]; then echo "::error::Bản build có source map:"; echo "$maps"; exit 1; fi
      - name: Kích thước bản build
        run: |
          {
            echo "### Frontend · kích thước dist"
            echo '```'
            du -sh dist
            find dist -type f \( -name '*.js' -o -name '*.css' \) -size +500k -exec du -h {} + | sort -rh | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
