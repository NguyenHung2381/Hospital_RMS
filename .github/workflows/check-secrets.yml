# Chặn commit nhầm bí mật / dữ liệu cá nhân (file .env, khoá, bản dump...).
# ci.yml gọi ở mọi PR / push / lịch tuần (lịch tuần quét toàn bộ lịch sử);
# chạy tay được ở Actions → "Kiểm tra · Bí mật".
name: Kiểm tra · Bí mật

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  files:
    name: File + chuỗi nhạy cảm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File không được có trong repo
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env(\.[a-z]+)?$|(^|/)secrets/|\.key$|\.pem$|\.p12$|\.pfx$|(^|/)id_(rsa|ed25519|ecdsa)$|\.(bak|dump|mdf|ldf)$|_CHUA_MAT_KHAU\.csv$|staff_license_import_unmatched\.csv$' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "::error::File nhạy cảm bị commit:"; echo "$bad"; exit 1; fi
      - name: Chuỗi bí mật trong mã nguồn
        run: |
          # Hash bcrypt thật, khoá riêng, chuỗi kết nối có mật khẩu ($ trong regex là ký tự, không phải biến)
          # shellcheck disable=SC2016
          hits=$(git grep -nE '\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(Password|Pwd)=[^;{$ ]{4,};' -- . ':!**/package-lock.json' || true)
          if [ -n "$hits" ]; then echo "::error::Có chuỗi giống bí mật:"; echo "$hits"; exit 1; fi

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks cần lịch sử commit
          persist-credentials: false
      - name: Gitleaks (các commit mới)
        # PR/push: chỉ quét commit mới. Lịch tuần / chạy tay: quét toàn bộ lịch sử.
        # Image ghim theo digest — tag có thể bị đẩy đè.
        env:
          EVENT: ${{ github.event_name }}
          PR_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          PUSH_RANGE: ${{ github.event.before }}..${{ github.sha }}
          IMAGE: zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
        run: |
          case "$EVENT" in
            pull_request) range="$PR_RANGE" ;;
            push) range="$PUSH_RANGE" ;;
            *) range="" ;;
          esac
          # Push đầu tiên của nhánh: before = 000… → quét toàn bộ
          case "$range" in 0000000000000000000000000000000000000000..*) range="" ;; esac
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" "$IMAGE" \
            git /repo --redact --no-banner ${range:+--log-opts=$range}
