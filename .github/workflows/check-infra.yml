# Hạ tầng: workflow CI/CD, Dockerfile, script shell. Lỗi ở đây thường chỉ lộ ra
# lúc deploy (hoặc thành lỗ hổng: template injection, action bị chiếm, token lộ).
# ci.yml gọi ở mọi PR / push / lịch tuần; chạy tay được ở Actions →
# "Kiểm tra · Hạ tầng". Mọi image công cụ ghim theo digest.
name: Kiểm tra · Hạ tầng

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    name: Workflow (actionlint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: actionlint
        # Cú pháp, biểu thức ${{ }}, kiểu input, shellcheck cho các khối run:
        env:
          IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        run: docker run --rm --network none -v "$PWD:/repo:ro" -w /repo "$IMAGE" -color
      - name: zizmor
        # Bảo mật workflow: template injection, quyền token thừa, action chưa ghim
        # SHA / commit giả mạo, lộ credential qua checkout, cache bị đầu độc...
        env:
          IMAGE: ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" -w /repo "$IMAGE" \
            --min-severity medium --format github .github/workflows

  dockerfile:
    name: Dockerfile (hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: hadolint
        # Chặn mức error/warning; quy tắc bỏ qua + lý do ở .hadolint.yaml
        env:
          IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo "$IMAGE" \
            hadolint --config .hadolint.yaml backend/Dockerfile frontend/Dockerfile

  shell:
    name: Script shell (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: shellcheck
        # scripts/deploy.sh chạy trên server production → lỗi shell = deploy hỏng
        env:
          IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          printf '  %s\n' "${files[@]}"
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo "$IMAGE" --severity=warning "${files[@]}"

  compose:
    name: docker compose (cú pháp)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: docker compose config
        # File .env thật không có trên CI → không đọc env_file, không thay biến
        run: |
          for f in docker-compose.yml docker-compose.prod.yml; do
            echo "== $f"
            docker compose -f "$f" config --quiet --no-interpolate --no-env-resolution
          done
