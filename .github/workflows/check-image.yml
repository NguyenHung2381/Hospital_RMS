# Chạy thử BẢN PRODUCTION trước khi có image trên GHCR — ngay trên PR, không đợi
# merge rồi mới biết. ci.yml gọi khi PR đổi backend/, frontend/, compose prod,
# deploy.sh (mọi push vào main / lịch tuần: luôn chạy); chạy tay được ở Actions →
# "Kiểm tra · Image".
#
# Build image target prod của cả 2 app (cùng tham số build-image.yml, đọc cache của
# main, KHÔNG ghi cache → PR không đầu độc được cache), rồi scripts/ci/smoke-prod.sh:
# registry tạm + PostgreSQL có SSL + docker-compose.prod.yml + scripts/deploy.sh
# (đường chính VÀ đường tự rollback) + kiểm tra HTTP/header/quyền. Chi tiết trong script.
name: Kiểm tra · Image

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Chạy thử bản production (compose + deploy.sh + rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend (prod)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: prod
          build-args: GIT_SHA=${{ github.sha }}
          tags: rms-smoke-backend:ci
          load: true
          cache-from: type=gha,scope=backend
      - name: Build frontend (prod)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          target: prod
          build-args: GIT_SHA=${{ github.sha }}
          tags: rms-smoke-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
      - name: Chạy thử
        env:
          SHA: ${{ github.sha }}
          BACKEND_SRC_IMAGE: rms-smoke-backend:ci
          FRONTEND_SRC_IMAGE: rms-smoke-frontend:ci
        run: |
          echo "### Chạy thử bản production" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/ci/smoke-prod.sh
