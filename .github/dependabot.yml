# PR cập nhật thư viện / GitHub Actions / base image hằng tuần. Bản minor + patch
# gộp 1 PR mỗi nơi cho đỡ ồn; major tách riêng để review kỹ. PR vẫn phải qua CI.
version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/backend', '/frontend']
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]
    ignore:
      # Kiểu Node phải khớp bản Node đang chạy (CI 22, Docker 24), không theo bản mới nhất
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint 8.x chỉ nhận typescript <6.1 → bỏ chặn khi typescript-eslint hỗ trợ TS 7
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ['/backend', '/frontend']
    schedule:
      interval: weekly
