server {
	listen 80;
	server_name nckh.bvnghean.vn bvnghean.vn www.bvnghean.vn localhost;
	# Upload tài liệu/video khoá học tối đa 300MB (TRAINING_MEDIA_MAX_MB)
	client_max_body_size 300m;
	root /usr/share/nginx/html;
	index index.html;

	# SSE (realtime) — tách riêng khỏi /api/ để tắt buffering/gzip và giữ kết
	# nối lâu (backend ping mỗi 25s, timeout 1h chỉ là lưới an toàn).
	location /api/v1/events {
		proxy_pass http://backend:3001;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		proxy_cache off;
		gzip off;
		proxy_read_timeout 1h;
	}

	location /api/ {
		proxy_pass http://backend:3001;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /uploads/ {
		proxy_pass http://backend:3001;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		try_files $uri /index.html;
	}
}
