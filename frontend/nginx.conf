# HTTPS kết thúc ở reverse proxy đứng trước (IIS / nginx host...) — container
# này chỉ nhận HTTP từ proxy đó. Proxy được tin cậy khai báo qua biến
# TRUSTED_PROXIES (xem docker/40-trusted-proxies.sh, sinh ra biến
# $from_trusted_proxy và bật module real_ip: $remote_addr = IP thật người dùng).

# Giao thức người dùng THỰC SỰ dùng: tin X-Forwarded-Proto chỉ khi request đến
# từ proxy tin cậy; còn lại lấy giao thức của chính kết nối vào container.
map $from_trusted_proxy $fwd_proto_claimed {
	1       $http_x_forwarded_proto;
	default "";
}
map $fwd_proto_claimed $fwd_proto {
	https   https;
	http    http;
	default $scheme;
}

# HSTS chỉ gửi qua HTTPS (trình duyệt bỏ qua HSTS trên HTTP, nhưng gửi đúng chỗ
# cho rõ ràng). Giá trị rỗng = nginx không gửi header.
map $fwd_proto $hsts {
	https   "max-age=31536000";
	default "";
}

# ─── Content-Security-Policy ─────────────────────────────────────────────────
# Gắn ở location / (trang SPA) qua /etc/nginx/snippets/rms-csp.conf. Vi phạm được
# trình duyệt gửi về /api/v1/csp-report và ghi vào log backend ("[CSP] vi phạm").
#   script-src không có 'unsafe-inline' / 'unsafe-eval': lỗi XSS chèn được thẻ
#     <script> hay onerror=... cũng không chạy — chặn lấy trộm access token.
#   blob: ở object-src/frame-src — xem PDF bằng <embed src=blob:> (FileViewerModal)
#   fonts.googleapis/gstatic — font Inter / Literata (nạp ở src/main.tsx)
#   style-src 'unsafe-inline' — antd chèn <style> lúc chạy (CSS-in-JS)
#   tile.openstreetmap.org — ô bản đồ Leaflet xem trước vùng điểm danh (Cấu hình hệ thống)
#   challenges.cloudflare.com — Cloudflare Turnstile ở form đăng ký công khai (khi bật)
#   google.com/gstatic.com/recaptcha — Google reCAPTCHA v2 ở form đăng ký công khai (khi bật)
# Cửa sổ in báo cáo (about:blank) thừa hưởng chính sách này — không chèn <script>
# nội tuyến vào đó (features/reports/utils/reportHelpers.ts openPrint).
map $host $csp_policy {
	default "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org; media-src 'self' blob:; object-src 'self' blob:; frame-src 'self' blob: https://challenges.cloudflare.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; worker-src 'self' blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/v1/csp-report";
}

# ─── Chống DoS ───────────────────────────────────────────────────────────────
# Đếm theo $binary_remote_addr = IP THẬT người dùng (module real_ip đã thay
# $remote_addr theo 00-trusted-proxies.conf, chỉ tin proxy trong TRUSTED_PROXIES).
#   api  — 30 req/s mỗi IP, burst 60: 1 lần tải trang SPA bắn ~20 request cùng
#          lúc vẫn lọt; vòng lặp spam bị trả 429 trước khi tới Node.
#   auth — 2 req/s mỗi IP cho đăng nhập / xác minh 2FA: mỗi lượt tốn ~200ms CPU
#          (bcrypt), là API dễ bị dùng để đánh sập server nhất.
#   conn — số kết nối SSE (/events) đồng thời mỗi IP.
# Backend có thêm giới hạn riêng (utils/rateLimit.js) cho request gọi thẳng :3001.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Giữ sẵn kết nối tới backend (không mở TCP mới cho mỗi request)
upstream rms_backend {
	server backend:3001;
	keepalive 32;
}

server {
	listen 80;
	server_name nckh.bvnghean.vn bvnghean.vn www.bvnghean.vn localhost;
	server_tokens off;
	# ONLY_TRUSTED_PROXIES (docker/40-trusted-proxies.sh): chặn máy trong LAN gọi
	# thẳng cổng 8081 bằng HTTP, bỏ qua reverse proxy HTTPS.
	if ($direct_client_allowed = 0) {
		return 403;
	}
	# Upload tài liệu/video khoá học tối đa 300MB (TRAINING_MEDIA_MAX_MB)
	client_max_body_size 300m;
	# Chống slowloris: client gửi header/body nhỏ giọt để giữ kết nối mãi. Đây
	# là thời gian chờ GIỮA 2 lần đọc, không phải tổng thời gian upload.
	client_header_timeout 15s;
	client_body_timeout 30s;
	send_timeout 30s;
	keepalive_timeout 30s;
	root /usr/share/nginx/html;
	index index.html;

	# File tĩnh: dùng bản .gz nén sẵn lúc build (frontend/Dockerfile) nếu có,
	# không tốn CPU nén lại mỗi request; file không có bản .gz thì nén động như dưới.
	gzip_static on;
	# Nén JSON / JS / CSS (SSE tắt riêng ở location /api/v1/events)
	gzip on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_vary on;
	gzip_types application/json application/javascript text/css text/plain image/svg+xml;

	# File build của Vite có hash trong tên (vd index-DeDyYwjm.js) — nội dung đổi
	# thì tên đổi, nên cho trình duyệt cache 1 năm, không hỏi lại server.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable" always;
		add_header X-Content-Type-Options nosniff always;
		try_files $uri =404;
	}

	# Đăng nhập + xác minh 2FA: giới hạn chặt hơn /api/ còn lại
	location ~ ^/api/v1/auth/(login|2fa/) {
		limit_req zone=auth burst=10 nodelay;
		proxy_pass http://rms_backend;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $fwd_proto;
	}

	# SSE (realtime) — tách riêng khỏi /api/ để tắt buffering/gzip và giữ kết
	# nối lâu (backend ping mỗi 15s, timeout 1h chỉ là lưới an toàn).
	location /api/v1/events {
		limit_conn conn 20;
		proxy_pass http://rms_backend;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		# GHI ĐÈ (không nối thêm): backend TRUST_PROXY=1 lấy đúng địa chỉ này
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $fwd_proto;
		proxy_buffering off;
		# nginx mặc định nuốt header X-Accel-* của backend → proxy HTTPS đứng
		# trước (nginx host) không thấy "X-Accel-Buffering: no", gom sự kiện vào
		# bộ đệm vài KB rồi mới đẩy: thay đổi từ máy khác tới client trễ hàng phút.
		proxy_pass_header X-Accel-Buffering;
		proxy_cache off;
		gzip off;
		proxy_read_timeout 1h;
	}

	location /api/ {
		limit_req zone=api burst=60 nodelay;
		proxy_pass http://rms_backend;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $fwd_proto;
	}

	location /uploads/ {
		limit_req zone=api burst=60 nodelay;
		proxy_pass http://rms_backend;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $fwd_proto;
	}

	# Trang web (SPA). Header bảo mật chỉ đặt ở đây — response /api, /uploads đã
	# có header của helmet từ backend, đặt thêm sẽ bị trùng.
	location / {
		add_header Strict-Transport-Security $hsts always;
		add_header X-Frame-Options DENY always;
		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
		add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
		# Content-Security-Policy (chặn thật). Nội dung chính sách: map $csp_policy ở
		# đầu file. Tên header do docker/41-csp.sh sinh lúc khởi động: mặc định
		# Content-Security-Policy; CSP_REPORT_ONLY=true (.env cạnh compose) quay về
		# chế độ chỉ báo cáo — dùng khi cần gỡ nhanh mà không build lại image.
		include /etc/nginx/snippets/rms-csp.conf;
		try_files $uri /index.html;
	}
}
