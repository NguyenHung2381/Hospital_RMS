# HTTPS kết thúc ở reverse proxy đứng trước (IIS / nginx host...) — container
# này chỉ nhận HTTP từ proxy đó. Proxy được tin cậy khai báo qua biến
# TRUSTED_PROXIES (xem docker/40-trusted-proxies.sh, sinh ra biến
# $from_trusted_proxy và bật module real_ip: $remote_addr = IP thật người dùng).

# Giao thức người dùng THỰC SỰ dùng: tin X-Forwarded-Proto chỉ khi request đến
# từ proxy tin cậy; còn lại lấy giao thức của chính kết nối vào container.
map $from_trusted_proxy $fwd_proto_claimed {
	1       $http_x_forwarded_proto;
	default "";
}
map $fwd_proto_claimed $fwd_proto {
	https   https;
	http    http;
	default $scheme;
}

# HSTS chỉ gửi qua HTTPS (trình duyệt bỏ qua HSTS trên HTTP, nhưng gửi đúng chỗ
# cho rõ ràng). Giá trị rỗng = nginx không gửi header.
map $fwd_proto $hsts {
	https   "max-age=31536000";
	default "";
}

server {
	listen 80;
	server_name nckh.bvnghean.vn bvnghean.vn www.bvnghean.vn localhost;
	server_tokens off;
	# Upload tài liệu/video khoá học tối đa 300MB (TRAINING_MEDIA_MAX_MB)
	client_max_body_size 300m;
	root /usr/share/nginx/html;
	index index.html;

	# SSE (realtime) — tách riêng khỏi /api/ để tắt buffering/gzip và giữ kết
	# nối lâu (backend ping mỗi 15s, timeout 1h chỉ là lưới an toàn).
	location /api/v1/events {
		proxy_pass http://backend:3001;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		# GHI ĐÈ (không nối thêm): backend TRUST_PROXY=1 lấy đúng địa chỉ này
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $fwd_proto;
		proxy_buffering off;
		proxy_cache off;
		gzip off;
		proxy_read_timeout 1h;
	}

	location /api/ {
		proxy_pass http://backend:3001;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $fwd_proto;
	}

	location /uploads/ {
		proxy_pass http://backend:3001;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $fwd_proto;
	}

	# Trang web (SPA). Header bảo mật chỉ đặt ở đây — response /api, /uploads đã
	# có header của helmet từ backend, đặt thêm sẽ bị trùng.
	location / {
		add_header Strict-Transport-Security $hsts always;
		add_header X-Frame-Options DENY always;
		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
		add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
		# CSP đang ở chế độ CHỈ BÁO CÁO (không chặn): vi phạm được gửi về
		# /api/v1/csp-report và ghi vào log backend. Theo dõi ~1 tuần, không còn
		# vi phạm hợp lệ thì đổi tên header thành Content-Security-Policy để chặn thật.
		#   blob: ở object-src/frame-src — xem PDF bằng <embed src=blob:> (FileViewerModal)
		#   fonts.googleapis/gstatic — font Mulish / Be Vietnam Pro (styles/global.css)
		#   style-src 'unsafe-inline' — antd chèn <style> lúc chạy (CSS-in-JS)
		#   challenges.cloudflare.com — Cloudflare Turnstile ở form đăng ký công khai (khi bật)
		add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'self' blob:; frame-src 'self' blob: https://challenges.cloudflare.com; worker-src 'self' blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/v1/csp-report" always;
		try_files $uri /index.html;
	}
}
