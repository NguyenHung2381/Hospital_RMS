services:
  server:
    build:
      context: ./server
      target: dev
    environment:
      NODE_ENV: development
      DB_SERVER: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # -L (legacy watch = polling): bind mount qua Docker Desktop không phát
    # native fs-events nên nodemon cần polling mới thấy thay đổi file.
    command: ["npx", "nodemon", "-L", "--trace-deprecation", "src/server.js"]
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      target: dev
    environment:
      VITE_API_HOST: server
      VITE_API_PORT: "3000"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
