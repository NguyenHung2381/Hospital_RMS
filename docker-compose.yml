# Tên project riêng cho môi trường dev. Không đặt thì Compose lấy tên thư mục
# (hospital_rms) — trùng với docker-compose.prod.yml, khiến 2 môi trường bị
# gộp vào 1 project: chạy file này sẽ dừng/tạo lại container của file kia
# (redis dùng chung tên service) và dùng chung volume (server_secrets → chung
# JWT secret). Tên container / volume dev có tiền tố hospital_rms_dev.
name: hospital_rms_dev

# node_modules nằm trong anonymous volume (/app/node_modules) — Compose GIỮ volume
# này khi tạo lại container, kể cả `up --build`, nên package mới thêm sau `git pull`
# không có trong đó (lỗi "Cannot find package ..."). Trước khi chạy app, so hash
# package.json + package-lock.json với dấu lưu trong node_modules; khác thì tự
# `npm ci` lại (npm ci chỉ xoá nội dung, không xoá thư mục mount point).
# Dùng: command: ["sh", "-c", *ensure-deps, "sh", <lệnh chạy app>...]
x-ensure-deps: &ensure-deps |
  set -e
  hash=$$(cat package.json package-lock.json | md5sum | cut -d' ' -f1)
  if [ "$$(cat node_modules/.deps-hash 2>/dev/null)" != "$$hash" ]; then
    echo "[deps] package.json/package-lock.json đã đổi → npm ci ..."
    npm ci --no-audit --no-fund --fetch-timeout=600000 --fetch-retries=5 --fetch-retry-maxtimeout=120000
    echo "$$hash" > node_modules/.deps-hash
  fi
  exec "$$@"
# npm_cache (named volume, /root/.npm): giữ cache tải về qua các lần tạo lại
# container → npm ci bị ngắt giữa chừng / chạy lại không phải tải lại từ đầu.

services:
  backend:
    build:
      context: ./backend
      target: dev
    environment:
      NODE_ENV: development
      PORT: "3000"
      # Tin đúng 1 hop proxy liền trước (Vite, xfwd: true) để req.ip = IP máy khách
      # (địa chỉ cuối trong X-Forwarded-For), thay vì IP container frontend (172.x).
      TRUST_PROXY: "1"
      # PostgreSQL trên chính máy chạy Docker. Ở máy khác: DEV_DB_SERVER=<địa chỉ> trong
      # .env cạnh file này (npm run setup:dev tự ghi khi nhập máy chủ khác localhost).
      DB_SERVER: "${DEV_DB_SERVER:-host.docker.internal}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Quét virus upload bằng service clamav bên dưới (ghi đè backend/.env).
      # Tắt: `CLAMAV_HOST=` trong file .env cạnh compose.
      CLAMAV_HOST: "${CLAMAV_HOST-clamav}"
      # Giữ tối thiểu 100 file log ngày (>= 3 tháng) cho promtail + trang /activity-logs
      LOG_RETENTION_FILES: "100"
      # Chặn heap V8 để GC dọn sớm thay vì phình tới khi Docker Desktop hết RAM.
      NODE_OPTIONS: "--max-old-space-size=384"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # -L (legacy watch = polling): bind mount qua Docker Desktop không phát
    # native fs-events nên nodemon cần polling mới thấy thay đổi file.
    # Gọi thẳng nodemon bằng node thay vì `npx nodemon`: npx để lại 1 tiến trình
    # npm (~75MB RSS) nằm chờ suốt đời container mà không làm gì.
    # sh -c chỉ chạy kiểm tra deps rồi `exec` thay thế chính nó → không để lại
    # tiến trình bọc ngoài.
    command: ["sh", "-c", *ensure-deps, "sh", "node", "node_modules/nodemon/bin/nodemon.js", "-L", "--trace-deprecation", "src/server.js"]
    mem_limit: 640m
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - npm_cache:/root/.npm
      # JWT secret tự sinh khi thiếu (docker-entrypoint.sh) — giữ qua restart/redeploy
      - server_secrets:/app/secrets
    depends_on:
      redis:
        condition: service_started
      # Chạy kèm khi `up backend`; required: false để `--scale clamav=0` vẫn chạy được
      clamav:
        condition: service_started
        required: false

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_HOST: backend
      VITE_API_PORT: "3000"
      CHOKIDAR_USEPOLLING: "true"
      # DEV_HTTPS=true (trong .env cạnh file này) → https://<IP-LAN>:5173, để điện
      # thoại quét QR bằng camera trực tiếp (Safari chặn camera trên HTTP).
      DEV_HTTPS: "${DEV_HTTPS:-false}"
      NODE_OPTIONS: "--max-old-space-size=512"
      # Rolldown (Rust) tạo 1 luồng worker cho MỖI core máy host (Docker Desktop
      # báo 20 core → 35 luồng rolldown-worker), mỗi luồng giữ vùng nhớ riêng của
      # mimalloc và không trả lại OS → pre-bundle nguội đạt đỉnh 1.5GB, chạy lâu
      # phình ~1.2GB RSS. 2 luồng + mimalloc trả trang trống ngay: đỉnh ~520MB,
      # transform toàn bộ src (~640 file) vẫn ~20s như cũ.
      ROLLDOWN_WORKER_THREADS: "2"
      ROLLDOWN_MAX_BLOCKING_THREADS: "2"
      RAYON_NUM_THREADS: "2"
      MIMALLOC_PURGE_DELAY: "0"
      MIMALLOC_ARENA_EAGER_COMMIT: "0"
    # Chạy vite trực tiếp, bỏ tiến trình `npm run dev` (~60MB RSS) bọc ngoài.
    command: ["sh", "-c", *ensure-deps, "sh", "node", "node_modules/vite/bin/vite.js"]
    # Lần quét/pre-bundle deps đầu tiên (sau npm ci) của Rolldown dùng bộ nhớ
    # native ngoài heap V8 — với giới hạn luồng ở trên đỉnh ~520MB, chừa gấp đôi.
    mem_limit: 1024m
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - npm_cache:/root/.npm
    depends_on:
      - backend

  # ─── Cache: Redis cho dashboard aggregates + danh mục/lookup (departments,
  # roles, categories, levels, round_types...) — cache-aside, không dùng làm
  # nguồn dữ liệu chính nên tắt hẳn persistence (RDB/AOF) để nhẹ CPU/disk I/O,
  # allkeys-lru tự đẩy key cũ khi đầy thay vì phải TTL tay từng key.
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--maxmemory", "128mb",
        "--maxmemory-policy", "allkeys-lru",
        "--save", "",
        "--appendonly", "no",
      ]
    # Chỉ mở trên loopback (cho backend chạy native `npm run dev`): Redis dev
    # không đặt mật khẩu, mở 0.0.0.0 thì máy khác trong LAN xoá được bộ đếm
    # rate-limit / bắn lệnh xoá cache phân quyền.
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 160m
    restart: unless-stopped

  # ─── Log stack: Promtail đọc file log của server → đẩy vào Loki ───────────────
  # KHÔNG chạy mặc định: trang /activity-logs đọc thẳng file log, không cần Loki,
  # và compose này không có Grafana để xem Loki. Cần thì bật riêng:
  #   docker compose --profile logs up -d
  loki:
    profiles: ["logs"]
    mem_limit: 256m
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    profiles: ["logs"]
    mem_limit: 96m
    image: grafana/promtail:3.5.1
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./infra/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - ./backend/logs:/logs:ro
    depends_on:
      - loki
    restart: unless-stopped

  # Quét virus file upload — chạy MẶC ĐỊNH (~1,5GB RAM). Image đã kèm sẵn CSDL
  # virus, freshclam trong container tự cập nhật khi có Internet. Máy yếu không
  # muốn chạy: đặt `CLAMAV_HOST=` trong .env cạnh compose rồi
  #   docker compose up -d --scale clamav=0
  clamav:
    image: clamav/clamav:stable
    mem_limit: 2g
    volumes:
      - clamav_db:/var/lib/clamav

volumes:
  clamav_db:
  npm_cache:
  loki_data:
  server_secrets:
