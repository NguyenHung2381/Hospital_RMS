services:
  server:
    build:
      context: ./backend
      target: dev
    environment:
      NODE_ENV: development
      # Tin proxy nội bộ (Vite/nginx trong mạng Docker) để req.ip = IP máy khách
      # qua X-Forwarded-For, thay vì IP container frontend (172.x).
      TRUST_PROXY: "loopback, uniquelocal"
      DB_SERVER: host.docker.internal
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Giữ tối thiểu 100 file log ngày (>= 3 tháng) cho promtail + trang /activity-logs
      LOG_RETENTION_FILES: "100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # -L (legacy watch = polling): bind mount qua Docker Desktop không phát
    # native fs-events nên nodemon cần polling mới thấy thay đổi file.
    command: ["npx", "nodemon", "-L", "--trace-deprecation", "src/server.js"]
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - redis

  client:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_HOST: server
      VITE_API_PORT: "3000"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - server

  # ─── Cache: Redis cho dashboard aggregates + danh mục/lookup (departments,
  # roles, categories, levels, round_types...) — cache-aside, không dùng làm
  # nguồn dữ liệu chính nên tắt hẳn persistence (RDB/AOF) để nhẹ CPU/disk I/O,
  # allkeys-lru tự đẩy key cũ khi đầy thay vì phải TTL tay từng key.
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--maxmemory", "128mb",
        "--maxmemory-policy", "allkeys-lru",
        "--save", "",
        "--appendonly", "no",
      ]
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ─── Log stack: Promtail đọc file log của server → đẩy vào Loki ───────────────
  loki:
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.5.1
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./infra/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - ./backend/logs:/logs:ro
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki_data:
