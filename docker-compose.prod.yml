services:
  server:
    build:
      context: ./backend
      target: prod
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      REDIS_HOST: redis
      # Tin proxy nội bộ (Vite/nginx trong mạng Docker) để req.ip = IP máy khách
      # qua X-Forwarded-For, thay vì IP container frontend (172.x).
      TRUST_PROXY: "loopback, uniquelocal"
      REDIS_PORT: "6379"
      # Origin trình duyệt dùng để truy cập web (ghi đè CORS_ORIGIN trong backend/.env)
      CORS_ORIGIN: "http://bvnghean.vn:8084,http://www.bvnghean.vn:8084"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # API không mở cổng ra ngoài — chỉ nginx (client) gọi tới qua mạng nội bộ
    expose:
      - "3000"
    volumes:
      - server_uploads:/app/uploads
      # JWT secret tự sinh khi thiếu (docker-entrypoint.sh) — giữ qua restart/redeploy
      - server_secrets:/app/secrets
    depends_on:
      - redis
    restart: unless-stopped

  client:
    build:
      context: ./frontend
      target: prod
    # http://bvnghean.vn:8084 → nginx (port 80 trong container)
    ports:
      - "8084:80"
    depends_on:
      - server
    restart: unless-stopped

  # Xem docker-compose.yml (dev) để biết lý do tắt persistence + allkeys-lru.
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--maxmemory", "128mb",
        "--maxmemory-policy", "allkeys-lru",
        "--save", "",
        "--appendonly", "no",
      ]
    restart: unless-stopped

volumes:
  server_uploads:
  server_secrets:
