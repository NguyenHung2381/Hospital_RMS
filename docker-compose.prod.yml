services:
  backend:
    build:
      context: ./backend
      target: prod
    # .env.production (nếu có) nạp sau → ghi đè .env: đặt DB_USER/DB_PASSWORD
    # của login riêng (scripts/create-app-login.sql) ở đây, .env giữ "sa" cho dev.
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./backend/.env.production
        required: false
    environment:
      # Luôn mã hoá kết nối app <-> SQL Server ở prod (ghi đè DB_ENCRYPT trong
      # backend/.env). SQL Server chưa cài chứng chỉ vẫn tự sinh cert tự ký →
      # DB_TRUST_SERVER_CERT=true (mặc định) để chấp nhận; có cert CA thật thì
      # đặt DB_TRUST_SERVER_CERT=false trong backend/.env.production.
      DB_ENCRYPT: "true"
      # Ghim cổng API (ghi đè PORT trong backend/.env) — phải khớp proxy_pass
      # trong frontend/nginx.conf.
      PORT: "3001"
      REDIS_HOST: redis
      # Tin proxy nội bộ (Vite/nginx trong mạng Docker) để req.ip = IP máy khách
      # qua X-Forwarded-For, thay vì IP container frontend (172.x).
      TRUST_PROXY: "loopback, uniquelocal"
      REDIS_PORT: "6379"
      # Origin trình duyệt dùng để truy cập web (ghi đè CORS_ORIGIN trong backend/.env)
      CORS_ORIGIN: "http://nckh.bvnghean.vn:8084,http://bvnghean.vn:8084,http://www.bvnghean.vn:8084"
      # Heap V8 < mem_limit để còn chỗ cho buffer (upload/xuất Excel) + stack.
      NODE_OPTIONS: "--max-old-space-size=384"
    mem_limit: 512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Mở localhost:3001 trên máy server (chỉ loopback, không lộ ra mạng) để
    # reverse proxy/IIS trên cùng máy gọi được API; nginx (client) vẫn gọi
    # backend:3001 qua mạng nội bộ Docker.
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - server_uploads:/app/uploads
      # JWT secret tự sinh khi thiếu (docker-entrypoint.sh) — giữ qua restart/redeploy
      - server_secrets:/app/secrets
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    # http://nckh.bvnghean.vn:8084 → nginx (port 80 trong container)
    ports:
      - "8084:80"
    mem_limit: 64m
    depends_on:
      - backend
    restart: unless-stopped

  # Xem docker-compose.yml (dev) để biết lý do tắt persistence + allkeys-lru.
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--maxmemory", "128mb",
        "--maxmemory-policy", "allkeys-lru",
        "--save", "",
        "--appendonly", "no",
      ]
    mem_limit: 160m
    restart: unless-stopped

volumes:
  server_uploads:
  server_secrets:
