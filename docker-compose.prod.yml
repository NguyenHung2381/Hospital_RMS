# Tên project cố định cho production — GIỮ NGUYÊN "hospital_rms": đây là tên
# mặc định cũ (lấy từ tên thư mục), các volume dữ liệu thật đang mang tiền tố
# này (hospital_rms_server_uploads, _server_logs, _server_secrets). Đổi tên là
# Compose tạo volume mới rỗng → "mất" file upload, log, JWT secret.
# Dev dùng project riêng (hospital_rms_dev, xem docker-compose.yml).
# Máy chủ đặt source ở thư mục tên khác: kiểm tra `docker volume ls` trước, rồi
# chạy với `-p <tên cũ>` hoặc COMPOSE_PROJECT_NAME=<tên cũ> để giữ volume.
name: hospital_rms

services:
  backend:
    build:
      context: ./backend
      target: prod
    # .env.production (nếu có) nạp sau → ghi đè .env: đặt DB_USER/DB_PASSWORD
    # của login riêng (scripts/create-app-login.sql) ở đây, .env giữ "sa" cho dev.
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./backend/.env.production
        required: false
    environment:
      # Luôn mã hoá kết nối app <-> SQL Server ở prod (ghi đè DB_ENCRYPT trong
      # backend/.env). SQL Server chưa cài chứng chỉ vẫn tự sinh cert tự ký →
      # DB_TRUST_SERVER_CERT=true (mặc định) để chấp nhận; có cert CA thật thì
      # đặt DB_TRUST_SERVER_CERT=false trong backend/.env.production.
      DB_ENCRYPT: "true"
      # Ghim cổng API (ghi đè PORT trong backend/.env) — phải khớp proxy_pass
      # trong frontend/nginx.conf.
      PORT: "3001"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Mật khẩu Redis do container redis tự sinh vào volume redis_secret;
      # docker-entrypoint.sh đọc file này khi REDIS_PASSWORD không được đặt.
      REDIS_PASSWORD_FILE: /run/redis-secret/pass
      # Quét virus file upload (tuỳ chọn): đặt CLAMAV_HOST=clamav trong file .env
      # cạnh compose và chạy kèm `--profile av` (service clamav bên dưới).
      CLAMAV_HOST: "${CLAMAV_HOST:-}"
      # Chỉ tin ĐÚNG 1 hop proxy liền trước (nginx container, hoặc proxy trên
      # host gọi thẳng 127.0.0.1:3001): req.ip = địa chỉ CUỐI trong
      # X-Forwarded-For do proxy đó ghi. nginx đã tự lọc IP thật theo
      # TRUSTED_PROXIES và GHI ĐÈ header (xem frontend/nginx.conf).
      # Cấu hình cũ "loopback, uniquelocal" bỏ qua mọi IP nội bộ — người dùng
      # bệnh viện đều có IP nội bộ nên tự khai X-Forwarded-For là vượt được
      # rate-limit đăng nhập.
      TRUST_PROXY: "1"
      # Origin trình duyệt dùng để truy cập web (ghi đè CORS_ORIGIN trong backend/.env)
      CORS_ORIGIN: "${CORS_ORIGIN:-https://nckh.bvnghean.vn}"
      # Access token ngắn hạn (frontend tự làm mới qua refresh cookie). Ghim ở
      # đây để một dòng JWT_EXPIRES_IN lạc trong file .env không kéo dài token.
      JWT_EXPIRES_IN: "15m"
      # Số worker của src/cluster.js. Server 8 core: 6 worker, chừa 2 core cho SQL
      # Server (cùng máy, host.docker.internal) + nginx + Redis. Mỗi worker
      # có pool DB riêng: tổng kết nối SQL Server = WEB_CONCURRENCY × DB_POOL_MAX.
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-6}"
      DB_POOL_MAX: "${DB_POOL_MAX:-10}"
      # bcrypt (native) chạy trên threadpool libuv, ~200ms CPU/lượt. Mỗi worker
      # chỉ chạy 1 bcrypt cùng lúc (utils/cpuGate.js) → tối đa 6 core cho đăng
      # nhập (~30 lượt/s), bị dội đăng nhập vẫn còn 2 core cho SQL Server. Hàng
      # đợi 20/worker ≈ chờ tối đa ~4s, quá thì 503.
      UV_THREADPOOL_SIZE: "4"
      LOGIN_MAX_CONCURRENT: "1"
      LOGIN_MAX_QUEUE: "20"
      # Heap V8 cho TỪNG tiến trình (primary + mỗi worker); tổng vẫn dưới
      # mem_limit, chừa chỗ cho buffer (upload/xuất Excel) + stack.
      NODE_OPTIONS: "--max-old-space-size=256"
    # ~300MB/worker × 6 + primary. Đổi WEB_CONCURRENCY thì chỉnh theo.
    mem_limit: 2304m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Mở localhost:3001 trên máy server (chỉ loopback, không lộ ra mạng) để
    # reverse proxy/IIS trên cùng máy gọi được API; nginx (client) vẫn gọi
    # backend:3001 qua mạng nội bộ Docker.
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - server_uploads:/app/uploads
      # JWT secret tự sinh khi thiếu (docker-entrypoint.sh) — giữ qua restart/redeploy
      - server_secrets:/app/secrets
      # Log hoạt động (audit-*.log) — nguồn dữ liệu của trang /activity-logs,
      # phải nằm ngoài container để không mất khi redeploy/tạo lại container.
      - server_logs:/app/logs
      - redis_secret:/run/redis-secret:ro
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    # https://nckh.bvnghean.vn (reverse proxy HTTPS) → :8084 → nginx (port 80).
    # Proxy HTTPS ở CÙNG máy thì đặt FRONTEND_BIND=127.0.0.1:8084 (file .env cạnh
    # compose) để máy khác trong LAN không gọi thẳng HTTP 8084 được nữa; proxy ở
    # máy khác thì giữ mặc định và chặn 8084 bằng firewall, chỉ mở cho IP proxy.
    ports:
      - "${FRONTEND_BIND:-8084}:80"
    environment:
      # IP/CIDR của reverse proxy HTTPS, phân cách dấu cách hoặc phẩy. Để trống
      # = mọi IP nội bộ (chạy được với proxy ở bất kỳ đâu trong LAN). Biết IP
      # proxy thì đặt hẹp lại — xem frontend/docker/40-trusted-proxies.sh.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
    mem_limit: 64m
    depends_on:
      - backend
    restart: unless-stopped

  # Xem docker-compose.yml (dev) để biết lý do tắt persistence + allkeys-lru.
  # Bắt buộc mật khẩu: container khác trong mạng Docker (vd frontend nếu bị
  # chiếm) không đọc/ghi được cache và kênh pub/sub xoá cache phân quyền.
  # Mật khẩu tự sinh 1 lần vào volume redis_secret (chỉ root đọc được), sau đó
  # chạy entrypoint gốc của image — entrypoint này tự hạ quyền xuống user redis.
  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -s /run/redis-secret/pass ]; then
          umask 077
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /run/redis-secret/pass
        fi
        exec docker-entrypoint.sh redis-server \
          --requirepass "$$(cat /run/redis-secret/pass)" \
          --maxmemory 128mb --maxmemory-policy allkeys-lru \
          --save "" --appendonly no
    volumes:
      - redis_secret:/run/redis-secret
    mem_limit: 160m
    restart: unless-stopped

  # Quét virus file upload — TUỲ CHỌN, không chạy mặc định (cần ~1,5GB RAM và
  # Internet để tải cơ sở dữ liệu virus). Bật:
  #   CLAMAV_HOST=clamav (file .env cạnh compose), rồi
  #   docker compose -f docker-compose.prod.yml --profile av up -d
  # Lần đầu tải CSDL virus mất vài phút; trong lúc đó upload bị từ chối (503)
  # vì backend mặc định không nhận file chưa quét được (CLAMAV_FAIL_OPEN).
  clamav:
    profiles: ["av"]
    image: clamav/clamav:stable
    mem_limit: 2g
    volumes:
      # CSDL virus — giữ qua lần tạo lại container, không phải tải lại từ đầu
      - clamav_db:/var/lib/clamav
    restart: unless-stopped

volumes:
  clamav_db:
  server_uploads:
  server_secrets:
  server_logs:
  redis_secret:
