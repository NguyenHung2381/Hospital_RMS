# Ghi đè rms.conf cho máy 8 GB RAM (4 vCPU), PostgreSQL dùng chung máy với
# Docker: backend 2 worker (~0,9 GB), ClamAV (~1,5 GB), Redis + nginx, hệ điều hành.
#
# Chỉ chứa các giá trị KHÁC rms.conf. Đặt tên zz-... để PostgreSQL đọc SAU rms.conf
# (các file trong conf.d được đọc theo thứ tự tên, giá trị đọc sau thắng):
#   sudo cp infra/postgresql/rms-ram-8gb.conf /etc/postgresql/18/main/conf.d/zz-rms-ram.conf
#   sudo systemctl restart postgresql@18-main
# scripts/setup-server.sh tự chép file này khi máy có 7–11 GB RAM.
#
# Kiểm tra: sudo -u postgres psql -c "SHOW shared_buffers; SHOW effective_cache_size;"
# Lên máy 12 GB trở lên: xoá zz-rms-ram.conf rồi restart, rms.conf tự có hiệu lực.

# ~25% RAM. Tính ra PostgreSQL dùng ~2,5–3 GB cả kết nối, còn chỗ cho ClamAV + backend.
shared_buffers = 2GB

# Chỉ là con số gợi ý cho bộ lập kế hoạch truy vấn, không cấp phát RAM. Bằng
# shared_buffers + page cache còn lại sau khi trừ ClamAV/backend/OS (~2 GB).
effective_cache_size = 4GB

# Mỗi tiến trình autovacuum (3 tiến trình) được dùng tới mức này: 512MB × 3 =
# 1,5 GB lúc cao điểm là quá nhiều với máy 8 GB. 256MB vẫn đủ cho VACUUM/CREATE INDEX.
maintenance_work_mem = 256MB

# 4 vCPU dùng chung với backend + ClamAV: không để một truy vấn báo cáo/xuất
# Excel kéo thêm 2 tiến trình song song chiếm 3/4 số core.
max_parallel_workers_per_gather = 1

# max_connections giữ 100 như rms.conf: máy 8 GB nhưng 8 vCPU thì backend chạy
# 6 worker × DB_POOL_MAX 10 = 60 kết nối. Kết nối nhàn rỗi tốn rất ít RAM.
