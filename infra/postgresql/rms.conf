# Cấu hình PostgreSQL 18 cho Hospital RMS — máy 12–16 GB RAM, ổ SSD, dùng chung
# với Docker (backend, ClamAV, Redis). Chép vào /etc/postgresql/18/main/conf.d/rms.conf
# (postgresql.conf của Ubuntu đã có include_dir = 'conf.d'), rồi
#   sudo systemctl restart postgresql@18-main
# Giá trị xuất phát, chỉnh theo số liệu thật (database/DB_SCALING_PLAN.md mục 7).

# ─── Kết nối ────────────────────────────────────────────────────────────────
# Container backend gọi ra máy host qua host.docker.internal (= cổng docker0,
# thường 172.17.0.1). Nghe mọi địa chỉ, chặn bằng pg_hba.conf + ufw (chỉ mở 5432
# cho dải mạng Docker) — xem infra/cai-dat-postgresql.md mục 4.
listen_addresses = '*'
port = 5432
# ≥ WEB_CONCURRENCY × DB_POOL_MAX (mặc định 6 × 10) + job + migration + dự phòng
max_connections = 100
password_encryption = scram-sha-256

# ─── Bộ nhớ ─────────────────────────────────────────────────────────────────
shared_buffers = 3GB
effective_cache_size = 8GB
work_mem = 16MB
maintenance_work_mem = 512MB
huge_pages = try

# ─── Ổ đĩa SSD ──────────────────────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200

# ─── WAL / checkpoint ───────────────────────────────────────────────────────
wal_compression = lz4
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
# Lưu WAL cho sao lưu theo thời điểm (pgBackRest) — bật khi đã cấu hình xong
# pgBackRest (infra/cai-dat-postgresql.md mục 7):
# archive_mode = on
# archive_command = 'pgbackrest --stanza=rms archive-push %p'

# ─── Autovacuum ─────────────────────────────────────────────────────────────
# Mức riêng cho bảng ghi nhiều đặt trong database/pg/baseline/03_toi_uu.sql
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# ─── Múi giờ ────────────────────────────────────────────────────────────────
timezone = 'Asia/Ho_Chi_Minh'
log_timezone = 'Asia/Ho_Chi_Minh'

# ─── Theo dõi truy vấn ──────────────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
track_io_timing = on
log_min_duration_statement = 500ms
auto_explain.log_min_duration = 2s
auto_explain.log_analyze = off
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 10s
