# Thêm các dòng này vào ĐẦU phần quy tắc của /etc/postgresql/18/main/pg_hba.conf
# (PG đọc từ trên xuống, dòng khớp đầu tiên được dùng), rồi
#   sudo systemctl reload postgresql@18-main
#
# TYPE  DATABASE      USER                 ADDRESS          METHOD
# Quản trị trên chính server (sudo -u postgres psql)
local   all           postgres                              peer
# Migration / chuyển dữ liệu / psql trên server
host    rms_hospital  rms_migrate,rms_app  127.0.0.1/32     scram-sha-256
# Container backend (mạng Docker: docker0 172.17.0.0/16 và mạng compose 172.18–31.x)
host    rms_hospital  rms_migrate,rms_app  172.16.0.0/12    scram-sha-256
# Mọi kết nối khác tới DB ứng dụng: từ chối
host    rms_hospital  all                  0.0.0.0/0        reject
host    rms_hospital  all                  ::/0             reject
